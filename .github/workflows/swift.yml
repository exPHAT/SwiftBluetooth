name: CI

on:
  push:
    branches: [master, 'v*']
  pull_request:
    branches: [master, 'v*']

jobs:

  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: swift build -v

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Compiles the iOS-only code that a macOS build never reaches
      - name: Build for iOS
        run: xcodebuild build -scheme SwiftBluetooth -destination 'generic/platform=iOS Simulator' -quiet

  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test
        run: swift test -v -c release

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        env:
          WORKING_DIRECTORY: Sources/SwiftBluetooth
